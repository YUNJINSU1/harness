onboarding = false
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[ui.toast]
delivery = "system"

[experimental]
pane_history = true

# --- Sidebar: Sheep pasture (top) + Agent Usage (bottom) ---

# $provider is the billing provider (claude / codex / …), $limit the shortest
# remaining window, $context the pane's context occupancy.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["$provider", "$limit"],
  ["$context"],
]

# Single-instance toggle for the whole sidebar: one right-hand column, 64
# columns wide, pasture on top and the limits panel filling the rest.
# Not usagebar.open-limits or huketo.sheep.toggle-side: each opens only its own
# pane, always at ratio 0.5, so neither can place the pair.
#
# Two bindings on purpose. Windows Terminal has no Kitty keyboard protocol, so
# ctrl+shift+<letter> arrives as plain ctrl+<letter> and herdr never sees the
# shift. prefix+u is herdr's own "most reliable" form; f9 is the single-press
# convenience. Drop whichever one you do not use.
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "bash \"$HOME/.config/herdr/scripts/sidebar-toggle.sh\""
description = "Sidebar: toggle pasture + usage"

[[keys.command]]
key = "f9"
type = "shell"
command = "bash \"$HOME/.config/herdr/scripts/sidebar-toggle.sh\""
description = "Sidebar: toggle pasture + usage"

# Repair key. A pane outlives the plugin process that drew it, so a dead
# sidebar still looks "open" to the toggle above and one press only clears the
# corpses. --rebuild closes and reopens in a single press.
[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "bash \"$HOME/.config/herdr/scripts/sidebar-toggle.sh\" --rebuild"
description = "Sidebar: rebuild pasture + usage"

[[keys.command]]
key = "f8"
type = "shell"
command = "bash \"$HOME/.config/herdr/scripts/sidebar-toggle.sh\" --rebuild"
description = "Sidebar: rebuild pasture + usage"

# --- Herdr Sheep (huketo.sheep) overlay ---
#
# open-here is an overlay over the pane you pressed the key in. Herdr restores
# the previous layout and focus when the pasture closes, so this is the "look
# at the whole flock for a second" key — distinct from the sidebar above,
# which stays put.
#
# `y` for 양. prefix+s is herdr's settings and prefix+p is previous_tab, so
# neither is available; f10 is the single-press form of prefix+y, the same pair
# the sidebar uses above (prefix+u / f9).
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "huketo.sheep.open-here"
description = "Sheep: pasture over this pane"

[[keys.command]]
key = "f10"
type = "plugin_action"
command = "huketo.sheep.open-here"
description = "Sheep: pasture over this pane"

[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "bash \"$HOME/.config/herdr/scripts/sidebar-toggle.sh\""
description = "Sidebar: toggle pasture + usage"

[theme]
name = "terminal"
auto_switch = false
